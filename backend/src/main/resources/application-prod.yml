# Perfil producción / Docker — sin application-local.yml
spring:
  jpa:
    show-sql: false
    open-in-view: false
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    web:
      pageable:
        default-page-size: 50
        max-page-size: 200

logging:
  level:
    com.fiscalizacionhse: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
