# =============================================================================
# Overrides LOCAL — puertos que no chocan con otros servicios del equipo
# =============================================================================
# Postgres host 5435  → evita conflicto con PG local (5434/5432)
# Frontend host 8081  → evita conflicto con puerto 80 y otros servicios web
# Backend host 8080   → mismo puerto que dev; apagar backend local si usas Docker
# =============================================================================

services:
  postgres:
    ports:
      - "${POSTGRES_HOST_PORT:-5435}:5432"

  backend:
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"

  frontend:
    ports:
      - "${FRONTEND_HOST_PORT:-8081}:80"
