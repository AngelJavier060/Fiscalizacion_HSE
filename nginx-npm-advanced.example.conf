# =============================================================================
# Nginx Proxy Manager — configuración para hse.improvement-solution.com
# =============================================================================
#
# PROBLEMA: subir PDF pasaba por NPM → frontend:8005 → backend, y el proxy
# devolvía 502/504. La API debe ir DIRECTO al backend en el puerto 8090.
#
# PASO 1 — Proxy Host principal (pestaña Details)
#   Domain: hse.improvement-solution.com
#   Scheme: http
#   Forward Hostname / IP: 172.17.0.1
#   Forward Port: 8005          ← solo Angular (archivos estáticos)
#   Block Common Exploits: ON
#   Websockets Support: ON
#
# PASO 2 — Custom locations (pestaña "Custom Locations" → Add location)
#   Define location:  /api
#   Scheme: http
#   Forward Hostname / IP: 172.17.0.1
#   Forward Port: 8090            ← backend Spring Boot
#
#   En "Custom Nginx Configuration" de ESA location, pegar:
#   ─────────────────────────────────────────────────────
#   client_max_body_size 105M;
#   proxy_connect_timeout 75s;
#   proxy_send_timeout 1800s;
#   proxy_read_timeout 1800s;
#   proxy_request_buffering off;
#   ─────────────────────────────────────────────────────
#
# PASO 3 — Pestaña Advanced del Proxy Host principal
#   Dejar VACÍO o solo (sin location / duplicado):
#   client_max_body_size 105M;
#
# NO poner proxy_pass ni location / en Advanced: NPM ya los genera y puede
# romper el sitio con 502 Bad Gateway.
#
# PASO 4 — Verificar en el VPS
#   curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8090/api/v1/api/ia/salud
#   # debe responder 200
#
#   curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8005/
#   # debe responder 200
#
# PASO 5 — Redeploy contenedores
#   cd /opt/fiscalizacion-hse
#   git pull origin main
#   docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# =============================================================================
