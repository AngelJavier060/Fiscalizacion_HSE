org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# La ruta del proyecto contiene espacios ("PROGRAMAS 2025 CONTRUCCION"), lo que corrompe
# la cache incremental del demonio de Kotlin en Windows ("Could not close incremental caches"
# / "Storage already registered"). Desactivar la compilacion incremental evita esos errores.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
