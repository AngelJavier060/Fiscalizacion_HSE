name: fiscalizacion_hse_mobile
description: App móvil Fiscalización HSE - Consulta documentos, notificaciones y chat IA
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0

  # Networking
  http: ^1.2.0
  dio: ^5.4.0
  retrofit: ^4.1.0

  # State Management
  provider: ^6.1.1
  riverpod: ^2.5.1
  flutter_riverpod: ^2.4.9

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Audio & Notifications
  audioplayers: ^5.2.1
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  flutter_local_notifications: ^17.0.0
  firebase_messaging: ^15.0.0
  firebase_core: ^3.0.0

  # PDF Viewer
  flutter_pdfview: ^1.3.2

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.2.4
  fluttertoast: ^8.2.4
  connectivity_plus: ^6.0.1
  path_provider: ^2.1.2
  cached_network_image: ^3.3.1
  flutter_html: ^3.0.0-beta.2
  markdown: ^7.2.1
  flutter_markdown: ^0.6.22
  uuid: ^4.3.3

  # Auth
  jwt_decoder: ^2.0.1
  google_sign_in: ^6.2.1
  local_auth: ^2.3.0

  # Permissions
  permission_handler: ^11.3.0
  android_intent_plus: ^6.0.0

  # Imagen / cámara (estilo CamScanner)
  image_picker: ^1.0.7
  google_mlkit_text_recognition: ^0.13.0
  pdf: ^3.12.0
  image: ^4.8.0

  open_filex: ^4.4.0

  # QR (solo si se requiere a futuro)
  # mobile_scanner: ^5.2.3
  # qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  retrofit_generator: ^8.1.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/
