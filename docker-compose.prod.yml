# =============================================================================
# Overrides PRODUCCIÓN — no expone DB ni API al host; solo frontend/nginx
# =============================================================================
# Antes de desplegar:
#   1. Copie .env.example → .env y configure secretos reales
#   2. Defina CORS_ALLOWED_ORIGINS con su dominio HTTPS
#   3. Cambie SUPER_ADMIN_PASSWORD y JWT_SECRET
# =============================================================================

services:
  postgres:
    ports: []
    restart: unless-stopped

  backend:
    ports: []
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod

  frontend:
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    restart: unless-stopped
