# =============================================================================
# Overrides PRODUCCIÓN (VPS) — mismo patrón que improvement-solutions / pollos
# =============================================================================
# Puertos asignados en el servidor (NO chocan con otros programas):
#
#   Proyecto                  Frontend   Backend    DB host
#   ─────────────────────────────────────────────────────────
#   improvement-solutions     8001       8082       PG nativo :5432
#   pollos-chanchos           8004       8088       Docker interno
#   seguimiento-agenda        4200       8081       PG nativo :5432
#   trading-bot               3001       5001       Docker interno
#   matenimiento-clientes     override   9088/9089  Docker interno
#   ─────────────────────────────────────────────────────────
#   fiscalizacion-hse         8005       8090       Docker interno (sin puerto host)
#
# Nginx del VPS apunta el dominio → localhost:8005 (frontend)
# El frontend hace proxy /api/ → backend interno (nginx.conf)
# =============================================================================

services:
  postgres:
    ports: []
    restart: unless-stopped

  backend:
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "${BACKEND_HOST_PORT:-8090}:8080"

  frontend:
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-8005}:80"
