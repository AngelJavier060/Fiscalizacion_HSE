# Nginx del VPS — ejemplo para Fiscalización HSE
# Ubicación típica: /etc/nginx/sites-available/hse.improvement-solution.com
# Enlazar: sudo ln -s .../sites-available/... sites-enabled/
#
# El contenedor frontend escucha en localhost:8005 (FRONTEND_HOST_PORT).
# Nginx hace proxy HTTPS → :8005. El frontend ya proxea /api/ al backend interno.

server {
    listen 80;
    server_name hse.improvement-solution.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name hse.improvement-solution.com;

    ssl_certificate /etc/letsencrypt/live/hse.improvement-solution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hse.improvement-solution.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        client_max_body_size 105M;
    }
}

